<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="55%" stop-color="#0F223A"/>
      <stop offset="100%" stop-color="#0A3336"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.42"/>
      <stop offset="65%" stop-color="#0D9488" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="112" y1="96" x2="400" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="340" y1="108" x2="404" y2="172" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed vibrant dark navy-teal background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#tealGlow)"/>

  <!-- Outer subtle luminous ring (inside safe zone) -->
  <circle cx="256" cy="256" r="164" stroke="url(#ringGrad)" stroke-width="18" stroke-opacity="0.28"/>
  <path d="M132 362 A164 164 0 1 1 398 338" stroke="url(#ringGrad)" stroke-width="20" stroke-linecap="round"/>

  <!-- Central bold white "F" monogram -->
  <path d="M188 158 H312 C324 158 332 166 332 178 C332 190 324 198 312 198 H230 V242 H294 C306 242 314 250 314 262 C314 274 306 282 294 282 H230 V348 C230 360 221 370 209 370 C197 370 188 360 188 348 V158 Z" fill="#FFFFFF"/>

  <!-- Dynamic speaking voice wave bars on the right -->
  <rect x="330" y="218" width="22" height="76" rx="11" fill="#2DD4BF"/>
  <rect x="366" y="236" width="20" height="44" rx="10" fill="#5EEAD4"/>

  <!-- Warm amber-gold focus spark -->
  <circle cx="364" cy="148" r="22" fill="url(#goldGrad)"/>
</svg>

name: Build FOCOENGLISH Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and build offline web bundle
        run: |
          npm ci
          npm run build

      - name: Sync web bundle into Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Release APKs
        working-directory: android
        run: |
          gradle assembleDebug assembleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focoenglish-mobile-v2-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Unsigned Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focoenglish-mobile-v2-release-apk
          path: android/app/build/outputs/apk/release/*.apk
